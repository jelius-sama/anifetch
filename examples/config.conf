# Image width in characters
img_width=40

# Space between image and text (in columns)
text_offset=4

# Crop mode: "auto" (preserve aspect) or "fill" (crop to fit)
crop_mode=fill

# Default image path (optional, can be overridden by command line)
# Note that this has to be a path to a file NOT directory even if `anifetch` supports it
# The reason why it is a path to file is because I wanted to maintain backwards compatibility.
image_path=~/.config/neofetch/image/IMG_4651.PNG

backend=neofetch
# OR: backend=fastfatch
